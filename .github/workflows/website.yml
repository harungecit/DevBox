# Publishes docs/ to Cloudflare Pages at https://devboxapp.com (www. and the
# old devbox.harungecit.dev hostname stay attached and 301-redirect via docs/_redirects)
#
# One-time setup (repository → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard → right sidebar → Account ID
#   CLOUDFLARE_API_TOKEN   API token with permissions:
#                            Account · Cloudflare Pages · Edit
#                            Zone    · DNS              · Edit   (zones: devboxapp.com, harungecit.dev)
# Everything else — creating the Pages project, attaching the custom domain,
# the CNAME record — is done here and is safe to re-run.

name: Website

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: devbox
  DOMAIN: devboxapp.com
  ZONE: devboxapp.com
  # Extra hostnames served by the same project: www + the previous address.
  # docs/_redirects sends both to https://devboxapp.com with a 301.
  EXTRA_DOMAINS: www.devboxapp.com devbox.harungecit.dev
  PAGES_HOST: devbox-6vu.pages.dev   # wrangler assigned this subdomain

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure the Pages project exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJECT }} --production-branch=main
        continue-on-error: true   # already exists on every run after the first

      - name: Deploy docs/
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=${{ env.PROJECT }} --branch=main --commit-dirty=true

      - name: Attach custom domain + DNS (idempotent)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }

          # 1) Custom domains on the Pages project (apex, www, previous hostname)
          for d in $DOMAIN $EXTRA_DOMAINS; do
            if ! api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT/domains" | jq -e --arg d "$d" '.result[]? | select(.name==$d)' >/dev/null; then
              api -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT/domains" --data "{\"name\":\"$d\"}" | jq -e .success >/dev/null
              echo "attached $d to Pages project"
            fi
          done

          # 2) DNS in the devboxapp.com zone: apex CNAME (flattened by Cloudflare) + www, both proxied.
          #    The zone must already exist in this Cloudflare account (register the
          #    domain or point its nameservers at Cloudflare first).
          ZONE_ID=$(api "https://api.cloudflare.com/client/v4/zones?name=$ZONE" | jq -r '.result[0].id')
          [ "$ZONE_ID" != "null" ] || { echo "::error::zone $ZONE not visible to this token — add devboxapp.com to Cloudflare and give the token Zone·DNS·Edit on it"; exit 1; }
          for name in $DOMAIN www.$DOMAIN; do
            if ! api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$name" | jq -e '.result | length > 0' >/dev/null; then
              api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
                --data "{\"type\":\"CNAME\",\"name\":\"$name\",\"content\":\"$PAGES_HOST\",\"proxied\":true,\"ttl\":1,\"comment\":\"DevBox website (Cloudflare Pages)\"}" | jq -e .success >/dev/null
              echo "created CNAME $name → $PAGES_HOST"
            fi
          done
          echo "Site: https://$DOMAIN"
